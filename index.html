<!DOCTYPE html>
<html lang="fr">
<head>
  <meta name="description" content="Le Ruban est un journal indépendant consacré à l’actualité, à l’information et à l’analyse des événements. Le Ruban - Journal indépendant et gratuit. leruban. leruban-journal.">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le Ruban · L’actualité</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="entete"></header>
  <main id="contenu"></main>
  <footer id="pied"></footer>

  <script src="articles.js"></script>
  <script>
    entete();
    const param = new URLSearchParams(location.search).get('cat');
    const cat = param ? nomCat(param) : null;
    const liste = cat ? ARTICLES.filter(a => memeCat(a.cat, cat)) : ARTICLES;
    const carte = (a, cls = '') =>
      `<article class="carte ${cls}"><span class="rub">${nomCat(a.cat)}</span>
       <h2><a href="${a.lien}">${a.titre}</a></h2><p>${a.resume}</p><time>${a.date}</time></article>`;

    let html = '';
    if (cat) {
      html = `<h1 class="rubrique">${cat}</h1>` +
        (liste.length ? `<div class="grille">${liste.map(a => carte(a)).join('')}</div>` : '<p>Aucun article dans cette rubrique pour le moment.</p>');
    } else if (liste.length) {
      html = carte(liste[0], 'une') + `<div class="grille">${liste.slice(1).map(a => carte(a)).join('')}</div>`;
    }
    document.getElementById('contenu').innerHTML = html || '<p>Aucun article pour le moment.</p>';
  </script>
</body>
</html>
